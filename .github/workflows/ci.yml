name: ci

# Every push and pull request builds the sender and the receiver for every platform and
# archives them. The `latest` pre-release is updated by every push to a branch (its tag moves to the pushed commit); a version
# tag (`git tag v0.1.0 && git push --tags`), or a run started by hand with a tag name, makes the release of that tag. A pull
# request does not publish anything. Changes to documentation, the license and editor settings alone do not start it.
on:
    push:
        branches: ["**"]
        tags:
            - "v*"
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
    pull_request:
        paths-ignore:
            - "**.md"
            - "LICENSE*"
            - "docs/**"
            - ".gitignore"
            - ".gitattributes"
            - ".prettierrc*"
            - ".editorconfig"
            - ".vscode/**"
            - ".github/dependabot.yml"
            - ".github/workflows/security.yml"
            - "**/.DS_Store"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag of the release to create (made from the selected branch if it does not exist)"
                required: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    RUST_BACKTRACE: 1

jobs:
    package:
        name: Build - ${{ matrix.platform.os-name }}
        strategy:
            fail-fast: false
            matrix:
                # https://github.com/actions/runner-images
                platform:
                    - {os-name: Linux-x86_64, runs-on: ubuntu-24.04, target: x86_64-unknown-linux-musl, ext: "", zip: false}
                    - {os-name: Linux-aarch64, runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "", zip: false}
                    - {os-name: Windows-x86_64, runs-on: windows-2025, target: x86_64-pc-windows-msvc, ext: ".exe", zip: true}
                    - {os-name: macOS-aarch64, runs-on: macos-26, target: aarch64-apple-darwin, ext: "", zip: false}
        runs-on: ${{ matrix.platform.runs-on }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  target: ${{ matrix.platform.target }}
                  override: true
                  profile: minimal
            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.target }}
            # musl-gcc compiles the C parts for the musl targets (built natively, not with cross)
            - name: Install musl tools
              if: contains(matrix.platform.target, 'linux-musl')
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            # macOS: cargo-post runs post_build.rs to package the .app bundles.
            - name: Build (macOS)
              if: runner.os == 'macOS'
              run: |
                  cargo install cargo-post
                  cargo post build --package open_remote_url_sender --locked --release --target ${{ matrix.platform.target }}
                  cargo post build --package open_remote_url_receiver --locked --release --target ${{ matrix.platform.target }}
            - name: Build
              if: runner.os != 'macOS'
              shell: bash
              env:
                  CC_x86_64_unknown_linux_musl: musl-gcc
                  CC_aarch64_unknown_linux_musl: musl-gcc
              run: |
                  if [[ "${{ matrix.platform.target }}" == *linux-musl ]]; then export RUSTFLAGS="-Ctarget-feature=+crt-static"; fi
                  cargo build --locked --release --target ${{ matrix.platform.target }}

            # One archive per program and platform: the executable, what it needs on that OS (macOS: the .app bundle; Windows: the
            # config; Linux: the install scripts and the config), the READMEs and the license; and the SHA-256 next to it.
            - name: Package
              shell: bash
              run: |
                  mkdir out
                  # macOS: a disk image of each .app bundle (OpenRemoteURLSender.app.dmg, OpenRemoteURLReceiver.app.dmg), released next to the archives
                  if [[ "${{ matrix.platform.target }}" == *-apple-darwin ]]; then
                    n=0
                    for app in target/${{ matrix.platform.target }}/release/*.app; do
                      [ -d "$app" ] || continue
                      base=$(basename "$app" .app)
                      hdiutil create -volname "$base" -srcfolder "$app" -ov -format UDZO "out/$base.app.dmg"
                      (cd out && shasum -a 256 "$base.app.dmg" > "$base.app.dmg.sha256")
                      n=$((n+1))
                    done
                    [ "$n" -gt 0 ] || { echo "no .app bundle was made"; exit 1; }
                  fi
                  readmes="README.md README.ja_JP.md README.ja_EZ.md README.zh_CN.md LICENSE"
                  scripts="scripts/install/install.sh scripts/uninstall/uninstall.sh scripts/config/config.sh"
                  pack() { # exe dir app-zip
                    local exe="$1" dir="$2" app="$3" files
                    case "${{ matrix.platform.target }}" in
                      *-apple-darwin) files="$app $dir/.env" ;;
                      *-pc-windows-*) files="$dir/.env" ;;
                      *) files="$scripts $dir/.env" ;;
                    esac
                    local name="$exe-${{ matrix.platform.os-name }}"
                    mkdir "$name"
                    cp "target/${{ matrix.platform.target }}/release/$exe${{ matrix.platform.ext }}" "$name/"
                    for f in $files $readmes; do cp "$f" "$name/"; done
                    if [ "${{ matrix.platform.zip }}" = "true" ]; then
                      archive="$name.zip"
                      "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "out/$archive" "$name"
                    else
                      archive="$name.tar.gz"
                      tar czf "out/$archive" "$name"
                    fi
                    (cd out && if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi)
                  }
                  pack open-remote-url-sender sender OpenRemoteURLSender.app.zip
                  pack open-remote-url-receiver receiver OpenRemoteURLReceiver.app.zip
            - uses: actions/upload-artifact@v4
              with:
                  name: open-remote-url-${{ matrix.platform.os-name }}
                  path: out/*
                  if-no-files-found: error

    # After the platforms have built. A platform that failed is missing from it.
    release:
        name: Release
        needs: package
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: List the files
              run: ls -l dist
            - name: Move the latest tag
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true \
                    || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/latest" -f sha="${{ github.sha }}"
            # The rolling release is made again by every push (the tag was moved just above): its date is the date of the push, and only the
            # files of this run are in it.
            - name: Remove the old rolling release
              if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release delete latest --repo "${{ github.repository }}" --yes || true
            - name: Make the release
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'latest' }}
                  target_commitish: ${{ github.sha }}
                  prerelease: false
                  # the rolling `latest` is shown as the latest release; a version tag keeps GitHub's own rule (by date)
                  make_latest: ${{ (inputs.tag || startsWith(github.ref, 'refs/tags/v')) && 'legacy' || 'true' }}
                  files: dist/*
                  generate_release_notes: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
                  fail_on_unmatched_files: true
